name: Site changed / parser broke
description: Google Finance changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth
        its own report because the fix is different from a code bug:
        something on google.com/finance moved.

        Useful to know before filing, because it narrows the fix a lot: every
        row comes out of the `AF_initDataCallback({key: 'ds:N', data: [...]})`
        blobs in the page's first response, found by the SHAPE of each record
        rather than by its `ds:N` key. There is no JSON-LD on this site and
        nothing is read from the DOM. So "no rows at all" usually means a
        record's shape changed, and "rows with one column empty" usually
        means one positional slot moved.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - No rows at all on a page that visibly has data (a record shape moved)
        - Rows come out with one column empty or wrong (a slot moved)
        - A known symbol reports not_found
        - A run reports unsupported_client with a browser engine
        - One mode returns nothing while the others are fine
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: >-
        The exact URL or --symbols, the --mode and --market, and how the
        browser was reached.
      placeholder: "https://www.google.com/finance/quote/GOOGL:NASDAQ (--mode financials, headless Chromium, no proxy, datacentre exit)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        A capture beats a description, and `--dump-html` writes one on
        success as well as on failure. Say which value the page shows and
        which the row carries, for one instrument.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, with a second --market, and
        when it last worked.
