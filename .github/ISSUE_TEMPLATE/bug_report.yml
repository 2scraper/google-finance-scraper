name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Zero rows and `unsupported_client` in the sidecar?** Not a
          block. Google Finance redirects a client whose User-Agent does not
          look like a browser to `/finance/beta/unsupported`; something
          overrode the engine's browser User-Agent. See
          [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **`not_found`?** An answer, not a failure: Google has no such
          instrument. Pairs are `EUR-USD`, not `EURUSD:CURRENCY`.
        - **`movers` has only a few rows per list?** Expected: Google
          publishes the top 1 to 4 of each list, not a full ranking.
        - **`eps` null on some instruments?** Expected where Google
          publishes none in that slot (0 of 88 periods on `7203:TYO`).
        - **`--pages 3` refused?** Expected: the site does not paginate.
          Use `--symbols` to read more instruments.
        - **Different rows from someone else's run?** The market page's
          lists are geo-selected. Pass `--market` and say which.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is
        blocked, 4 is "ran fine, found nothing", 5 is "the content was never
        obtained". The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --mode quote --symbols GOOGL:NASDAQ,EUR-USD --out quotes
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        46 rows, as the README says `--mode markets --market US` yields.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
